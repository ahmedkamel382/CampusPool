name: campuspool
description: AASTMT Ride-sharing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & State
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  provider: ^6.1.5+1

  # Map & Location Services
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  http: ^1.6.0

  # Search & Utilities
  geoflutterfire2: ^2.3.15
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.3.1

  # QR & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # UI & Branding (Added today)
  flutter_native_splash: ^2.4.0
  cached_network_image: ^3.4.1

dependency_overrides:
  cloud_firestore: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/aastmt_logo.png
    - assets/app_logo.png
    - .env

# --------------------------------------------------------
# BRANDING CONFIGURATIONS
# --------------------------------------------------------

# 1. App Icon Generator
flutter_launcher_icons:
  image_path: "assets/app_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"

# 2. Splash Screen Generator
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/app_logo.png"
  android_12:
    image: "assets/app_logo.png"
    icon_background_color: "#FFFFFF"